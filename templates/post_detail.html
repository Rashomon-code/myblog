<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Post Detail - My Blog</title>

    <style>
        body {
            width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        button {
            margin: 5px;
        }

        .post-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .post-content {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .nav-links {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div id="nav" class="nav-links">
    <button onclick="goHome()">Home</button>
</div>

<h1 id="title">読み込み中...</h1>
<div class="post-meta">
    <span>投稿日: <span id="created-at">-</span></span>
</div>

<div class="post-content" id="content">
    文章を読み込んでいます...
</div>

<!-- 僅限文章作者或登入使用者顯示的操作區 -->
<div id="action-buttons"></div>

<script>
function goHome() {
    location.href = "/";
}

function goEdit(postId) {
    location.href = `/edit?id=${postId}`;
}

// URL から id を獲得します（/post_detail.html?id=123）
const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get("id");

const token = localStorage.getItem("token");

async function fetchPostDetail() {
    if (!postId) {
        document.getElementById("title").textContent = "記事が見つかりません";
        document.getElementById("content").textContent = "";
        return;
    }

    try {
        // 實際開發時替換為您的 API Endpoint
        // const response = await fetch(`/api/posts/${postId}`);
        // const post = await response.json();

        // 假資料示範
        const post = {
            id: postId,
            title: "初めてのブログ投稿",
            createdAt: "2026-08-01",
            content: "これはサンプル記事の内容です。Webアプリケーションの構築はとても楽しいですね！",
            authorId: "user_123" // 假設的文章作者 ID
        };

        // 渲染文章內容
        document.getElementById("title").textContent = post.title;
        document.getElementById("created-at").textContent = post.createdAt;
        document.getElementById("content").textContent = post.content;

        // 如果使用者已登入，顯示編輯/刪除按鈕
        if (token) {
            document.getElementById("action-buttons").innerHTML = `
                <button onclick="goEdit('${post.id}')">Edit Post</button>
                <button onclick="deletePost('${post.id}')">Delete Post</button>
            `;
        }
    } catch (error) {
        console.error("Error fetching post:", error);
        document.getElementById("title").textContent = "エラーが発生しました";
    }
}

async function deletePost(id) {
    if (confirm("本当にこの記事を削除しますか？")) {
        // 刪除邏輯
        /*
        await fetch(`/api/posts/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        */
        alert("記事を削除しました");
        goHome();
    }
}

fetchPostDetail();

</script>

</body>
</html>
