<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>My Page - My Blog</title>

    <style>
        body {
            width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        button {
            margin: 5px;
        }

        .post-list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
    </style>
</head>

<body>

<h1>My Page</h1>

<p id="status">読み込み中...</p>

<div id="content">
</div>

<div id="menu">
    <button onclick="goHome()">Home</button>
    <button onclick="logout()">Logout</button>
</div>

<script>

function goHome() {
    location.href = "/";
}

function logout() {
    localStorage.removeItem("token");
    location.href = "/";
}

const token = localStorage.getItem("token");

if (!token) {
    location.href = "/login";
} else {
    document.getElementById("status").textContent = "マイページ";

    fetch('/api/mypage', {
        method: 'GET',
        headers: {
            'Authorization': 'Bearer ' + token
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('データ獲得できませんでした');
        }
        return response.json();
    })
    .then(data => {
        const posts = data.posts;

        let postsHtml = '';
        
        if (!posts || posts.length === 0) {
            postsHtml = '<p>まだ投稿はありません。</p>';
        } else {
            postsHtml = '<ul>';
            posts.forEach(post => {
                postsHtml += `<li><a href="/posts/${post.id}"><strong>${post.title}</strong></a><p>${post.created_at}</p></li>`;
            });
            postsHtml += '</ul>';
        }

        document.getElementById("content").innerHTML = `
            <p>使用者 ID: ${data.user_id}</p>
            <div class="post-list">
                <h3>あなたの投稿</h3>
                ${postsHtml}
            </div>
        `;
    })
}

</script>

</body>
</html>
