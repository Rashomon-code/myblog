<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>My Blog - ログイン</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Yu Gothic", sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:white;
            height:70px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 60px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:#333;
            cursor:pointer;
        }

        main{
            height:calc(100vh - 70px);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,.08);
            width:100%;
            max-width:400px;
        }

        h1{
            font-size:28px;
            color:#333;
            margin-bottom:24px;
            text-align:center;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#555;
            font-size:14px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:16px;
            outline:none;
            transition:.3s;
        }

        input:focus{
            border-color:#2196F3;
            box-shadow:0 0 0 3px rgba(33,150,243,0.1);
        }

        .submit-btn{
            width:100%;
            background:#2196F3;
            color:white;
            border:none;
            padding:12px;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        .submit-btn:hover{
            background:#1e87f0;
        }

    </style>
</head>

<body>

<header>
    <div class="logo" onclick="goHome()">
        My Blog
    </div>
</header>

<main>
    <div class="login-card">
        <h1>ログイン</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" placeholder="ユーザー名を入力">
            </div>
            
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" placeholder="パスワードを入力">
            </div>
            
            <button type="submit" class="submit-btn">
                ログインする
            </button>
        </form>
    </div>
</main>

<script>
function goHome(){
    window.location.href = "/";
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    });

    const result = await response.json();

    alert(result.message);
});
</script>

</body>
</html>
