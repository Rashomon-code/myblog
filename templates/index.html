<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>My Blog</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Yu Gothic", sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:white;
            height:70px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 60px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:#333;
            cursor: pointer;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .login-btn{
            background:#2196F3;
            color:white;
            border:none;
            padding:10px 24px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#1e87f0;
        }

        .logout-btn{
            background:#ff4d4f;
            color:white;
            border:none;
            padding:10px 24px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .logout-btn:hover{
            background:#d9363e;
        }

        .welcome-text {
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }

        main{
            height:calc(100vh - 70px);
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        }

        h1{
            font-size:50px;
            color:#333;
        }

        p{
            margin-top:20px;
            color:#777;
            font-size:20px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo" onclick="goHome()">
        My Blog
    </div>

    <div class="header-buttons" id="authContainer">
        <button class="login-btn" onclick="goLogin()">
            ログイン
        </button>
    </div>
</header>

<main>
    <h1 id="mainTitle">ようこそ！</h1>
    <p>
        シンプルなブログへようこそ。
    </p>
</main>

<script>
function goHome(){
    window.location.href = "/";
}

function goLogin(){
    window.location.href = "/login";
}

document.addEventListener("DOMContentLoaded", function() {
    const token = localStorage.getItem("token");
    const authContainer = document.getElementById("authContainer");
    const mainTitle = document.getElementById("mainTitle");

    if (token) {
        mainTitle.textContent = "ようこそ、おかえりなさい！";
        
        authContainer.innerHTML = `
            <span class="welcome-text">ログイン中</span>
            <button class="logout-btn" onclick="logout()">
                ログアウト
            </button>
        `;
    } else {
        authContainer.innerHTML = `
            <button class="login-btn" onclick="goLogin()">
                ログイン
            </button>
        `;
    }
});

function logout() {
    localStorage.removeItem("token");
    alert("ログアウトしました");
    window.location.reload();
}
</script>

</body>
</html>
