<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>My Blog</title>

    <style>
        body {
            width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        button {
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>My Blog</h1>

<p id="status">ログインしてください</p>

<div id="menu">
    <button onclick="goLogin()">Login</button>
    <button onclick="goRegister()">Register</button>
</div>

<script>

function goLogin() {
    location.href = "/login";
}

function goRegister() {
    location.href = "/register";
}

function goPost() {
    location.href = "/create";
}

function logout() {
    localStorage.removeItem("token");
    location.reload();
}

const token = localStorage.getItem("token");

if (token) {

    document.getElementById("status").textContent = "お帰りなさい";

    document.getElementById("menu").innerHTML = `
        <button onclick="goPost()">Create Post</button>
        <button onclick="logout()">Logout</button>
    `;

}

</script>

</body>
</html>
